server:
  port: 8084

spring:
  application:
    name: notification-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:127.0.0.1}:5432/notification_db
    username: shop
    password: shop123
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  rabbitmq:
    host: ${RABBIT_HOST:127.0.0.1}
    port: 5672
    username: shop
    password: shop123
    listener:
      simple:
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1s
          multiplier: 2
  mail:
    host: ${MAIL_HOST:127.0.0.1}
    port: 1025

app:
  mail:
    from: no-reply@shop.com

management:
  endpoints:
    web:
      exposure:
        include: health
  health:
    mail:
      enabled: false