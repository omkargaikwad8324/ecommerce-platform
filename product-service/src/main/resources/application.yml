server:
  port: 8082

spring:
  application:
    name: product-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:127.0.0.1}:5432/product_db
    username: shop
    password: shop123
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: 6379
      timeout: 2s
      connect-timeout: 2s

app:
  internal-key: ${INTERNAL_KEY:dev-internal-key-change-me}
  cache:
    product-ttl-minutes: 10