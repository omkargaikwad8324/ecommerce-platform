name: E-commerce CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build, unit and integration tests
        run: mvn -B verify

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            **/target/surefire-reports
            **/target/failsafe-reports

  docker-build:
    runs-on: ubuntu-24.04
    needs: test
    strategy:
      fail-fast: false
      matrix:
        module: [auth-service, gateway, product-service, order-service, notification-service]
    steps:
      - uses: actions/checkout@v6

      - name: Build image for ${{ matrix.module }}
        run: docker build --build-arg MODULE=${{ matrix.module }} -t shop-${{ matrix.module }} .