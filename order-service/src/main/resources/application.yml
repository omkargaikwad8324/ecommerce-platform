server:
  port: 8083

spring:
  application:
    name: order-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:127.0.0.1}:5432/product_db
    username: shop
    password: shop123
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate.default_batch_fetch_size: 20
  rabbitmq:
    host: ${RABBIT_HOST:127.0.0.1}
    port: 5672
    username: shop
    password: shop123
    connection-timeout: 2s

app:
  internal-key: ${INTERNAL_KEY:dev-internal-key-change-me}
  product-service:
    url: ${PRODUCT_SERVICE_URL:http://127.0.0.1:8082}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

logging:
  pattern:
    level: "%5p [rid=%X{rid:-}]"